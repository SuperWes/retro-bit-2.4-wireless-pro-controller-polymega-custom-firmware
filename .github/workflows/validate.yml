name: Validate firmware packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Package legacy preparation script for regression checks
        run: python tools/package_release.py --output build/installer.zip
      - name: Test firmware ZIP and legacy preparer without flashing
        run: python tests/test_windows_installer.py --package build/installer.zip
